spring.application.name=law-job
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Steps and documents are inserted by the thousand on a first run.
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true

assemblee-nationale.legislature=17
assemblee-nationale.dossiers-archive-url=https://data.assemblee-nationale.fr/static/openData/repository/17/loi/dossiers_legislatifs/Dossiers_Legislatifs.json.zip
# Some of the Assemblée's servers serve an archive hours older than others: an older download is retried, then the run is skipped.
assemblee-nationale.stale-archive-attempts=3
assemblee-nationale.stale-archive-retry-delay=PT1M

# Run once and exit by default (Kubernetes CronJob). Set law.sync.schedule.enabled=true to stay up and sync on the cron.
law.sync.schedule.enabled=false
law.sync.cron=0 30 3 * * *
law.sync.zone=Europe/Paris

# S3-compatible raw storage (OVH Object Storage). Credentials come from the environment, never from this file.
storage.endpoint=${STORAGE_ENDPOINT}
storage.region=${STORAGE_REGION}
storage.bucket=${STORAGE_BUCKET}
storage.access-key=${STORAGE_ACCESS_KEY}
storage.secret-key=${STORAGE_SECRET_KEY}
storage.path-style=false
storage.require-versioning=true
