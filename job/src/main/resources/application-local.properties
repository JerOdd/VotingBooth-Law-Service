# Postgres from docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5434/laws
spring.datasource.username=postgres
spring.datasource.password=postgres

# SeaweedFS from docker-compose.yml, with the identity declared in its s3 service.
# 9001 on the host: representative-service's S3 already uses 9000.
storage.endpoint=http://localhost:9001
storage.region=us-east-1
storage.bucket=law-raw
storage.access-key=local
storage.secret-key=local-secret
storage.path-style=true
